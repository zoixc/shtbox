services:
  shtbox:
    build: .
    image: shtbox:latest
    container_name: shtbox
    restart: unless-stopped
    # только localhost; наружу публикуйте через TLS-прокси (Caddy/Traefik/nginx)
    ports:
      - "127.0.0.1:8080:8080"
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    ulimits:
      nofile: { soft: 2048, hard: 2048 }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
