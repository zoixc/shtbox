# Полный конфиг для nginx-unprivileged: без root, без записи в ФС, все временные файлы в /tmp (tmpfs).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
    model/gltf-binary glb;
    model/gltf+json gltf;
  }
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;

  # временные каталоги — в tmpfs
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # это статический сайт: тело запроса не нужно, таймауты короткие (защита от slowloris)
  client_max_body_size 1k;
  client_header_buffer_size 2k;
  large_client_header_buffers 2 4k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 15s;
  keepalive_timeout 15s;
  reset_timedout_connection on;

  limit_req_zone $binary_remote_addr zone=perip:2m rate=50r/s;
  limit_conn_zone $binary_remote_addr zone=connip:2m;

  log_format main '$remote_addr "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout main;

  gzip on;
  gzip_static on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json model/gltf-binary;

  server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=perip burst=100 nodelay;
    limit_conn connip 30;

    include /etc/nginx/security-headers.conf;

    # скрытые файлы и карты кода не отдаём
    location ~ /\. { return 404; }
    location ~ \.map$ { return 404; }

    # Необязательный сервер синхронизации (docker compose --profile sync). Хранит только шифртекст.
    # Адрес — через переменную и resolver: без сервиса nginx всё равно стартует, а запросы получают 502.
    location /sync/v1/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      limit_except GET PUT DELETE { deny all; }
      client_max_body_size 26m;
      client_body_timeout 30s;
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $sync_upstream http://sync:8081;
      proxy_pass $sync_upstream;
      proxy_request_buffering off;   # тело до 25 МБ идёт потоком, tmpfs 16 МБ его не вместит
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location = /healthz {
      limit_except GET HEAD { deny all; }
      access_log off;
      default_type text/plain;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    # файлы с хэшем в имени — кэшируем навсегда
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      limit_except GET HEAD { deny all; }
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # 3D-модели (GLB) — имя без хэша: кэшируем сутки и проверяем ETag
    location /models/ {
      include /etc/nginx/security-headers.conf;
      limit_except GET HEAD { deny all; }
      types { model/gltf-binary glb; }
      default_type application/octet-stream;
      add_header Cache-Control "public, max-age=86400, must-revalidate" always;
      try_files $uri =404;
    }

    # service worker и точки входа — всегда проверяем обновление
    location ~ ^/(sw\.js|index\.html|manifest\.webmanifest)$ {
      include /etc/nginx/security-headers.conf;
      limit_except GET HEAD { deny all; }
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      limit_except GET HEAD { deny all; }
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
