name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: shtbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shtbox:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test (hardened runtime flags)
        run: |
          # ошибки docker выводим аннотацией — так их видно и без полного лога
          fail() { echo "::error::$*"; exit 1; }
          out=$(docker run -d --name shtbox-ci -p 127.0.0.1:18080:8080 --read-only \
            --tmpfs /tmp:size=16m,mode=1777,noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges:true shtbox:ci 2>&1) || fail "docker run: $out"
          ok=
          for i in $(seq 1 20); do curl -fsS localhost:18080/healthz && ok=1 && break || sleep 1; done
          [ -n "$ok" ] || fail "healthz: $(docker logs shtbox-ci 2>&1 | tail -20 | tr '\n' '|')"
          curl -fsSI localhost:18080/ | grep -i "content-security-policy"
          curl -fsSI localhost:18080/ | grep -i "x-content-type-options: nosniff"
          curl -fsSI localhost:18080/sw.js | grep -i "cache-control: no-cache"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:18080/)" = 403
          docker logs shtbox-ci
      - name: Compose smoke test (web + sync profile, .env variables)
        env:
          SHTBOX_PORT: '18081'
          SYNC_INVITE: 'ci-invite'
        run: |
          fail() { echo "::error::$*"; exit 1; }
          docker rm -f shtbox-ci >/dev/null
          out=$(docker compose --profile sync up -d --build --wait --wait-timeout 120 2>&1) || fail "compose up: $(echo "$out" | tail -15 | tr '\n' '|')"
          curl -fsS localhost:18081/healthz
          id=$(printf 'a%.0s' $(seq 32)); tok=$(printf 'b%.0s' $(seq 40)); url=localhost:18081/sync/v1/$id
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code -X PUT $url -H "Authorization: Bearer $tok" -H 'If-None-Match: *' --data-binary secret)" = 403 || fail "sync: invite is not enforced"
          test "$(code -X PUT $url -H "Authorization: Bearer $tok" -H 'If-None-Match: *' -H 'X-Invite: ci-invite' --data-binary secret)" = 201 || fail "sync: PUT through nginx failed"
          test "$(curl -s $url -H "Authorization: Bearer $tok")" = secret || fail "sync: GET returned wrong body"
          test "$(code $url -H "Authorization: Bearer $(printf 'c%.0s' $(seq 40))")" = 401 || fail "sync: foreign token accepted"
          test "$(code -X DELETE $url -H "Authorization: Bearer $tok")" = 204 || fail "sync: DELETE failed"
          docker compose --profile sync down -v
